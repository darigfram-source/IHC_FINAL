<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#059669">
<title>Sin conexión · NutriMasa</title>
<style>
  :root { --bg:#f8fafc; --card:#ffffff; --texto:#0f172a; --suave:#475569; --borde:#e2e8f0; --primario:#059669; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#090e17; --card:#111827; --texto:#f1f5f9; --suave:#94a3b8; --borde:#1e293b; --primario:#10b981; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
         background:var(--bg); color:var(--texto); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:420px; width:100%; background:var(--card); border:1px solid var(--borde); border-radius:24px; padding:28px; text-align:center; }
  h1 { font-size:1.2rem; margin:0 0 8px; }
  p { font-size:.9rem; line-height:1.5; color:var(--suave); margin:0 0 20px; }
  .botones { display:flex; flex-direction:column; gap:10px; }
  a, button { display:block; min-height:44px; padding:12px 16px; border-radius:14px; font:inherit; font-weight:700; font-size:.9rem; text-decoration:none; cursor:pointer; }
  button { background:var(--primario); color:#fff; border:0; }
  a { color:var(--primario); border:1px solid var(--borde); }
</style>
</head>
<body>
<main>
  <h1>Sin conexión</h1>
  <p>Esta pantalla todavía no está guardada en tu dispositivo. Abre NutriMasa una vez con internet y quedará disponible aunque no tengas red. Lo que registres sin conexión se guarda y se sube solo cuando vuelva el internet.</p>
  <div class="botones">
    <button type="button" onclick="location.reload()">Reintentar</button>
    <a href="/paciente/dashboard">Ir al inicio</a>
  </div>
</main>
</body>
</html>
